{n:'☕ Coffee Cranberry Rush',t:'The Trailblazer',d:"You get bored easily, and honestly? That's your superpower. You're the friend who's already booked the trip nobody else thought of. Comfort zones are cute, but you'd rather find out what's around the corner."},
{n:'🍊 Spiced Mandarin',t:'The Celebrator',d:"You could turn a Tuesday into a party. You're the reason group chats blow up and plans actually happen. Wherever you go, the energy goes up a notch — people just feel lighter around you."},
{n:'🍓 Strawberry Vanilla Cream',t:'The Dreamer',d:"Your brain works in what-ifs and someday-maybes, and honestly, the world needs more of that. You notice beauty other people walk right past, and you're not afraid to believe things can turn out good."},
{n:'🔥 Grapefruit Ginger Ember',t:'The Adventurer',d:"You don't wait for permission — you just go. Uncertainty doesn't scare you, it excites you. Whether it's a new city, a new hobby, or a wild idea, you're the first one to say 'let's just try it.'"},
{n:'🩷 Dragonfruit Grapefruit Frost',t:'The Trendsetter',d:"You had it before it was cool — literally. You've got a sixth sense for what's next, and people quietly (or not so quietly) watch what you do before they try it themselves."},
{n:'🍑 Orange Apricot Sunset',t:'The Optimist',d:"Bad day? You'll find the silver lining before anyone else even finishes complaining. You're not naive, you just choose to see what's good — and somehow that rubs off on everyone around you."},
{n:'🫖 Spiced Tea Spark',t:'The Storyteller',d:"You're the one people end up talking to for hours without noticing the time. You ask the right questions, you actually listen, and you have a way of making ordinary moments feel like they matter."}

function home(){app.innerHTML=logo()+"<div class=center><h1>❄ Winter Flavor Oracle ❄</h1><h3>Which Winter Spark Are You?</h3><p>Something exciting is brewing this winter...</p><p>Answer 6 quick questions to discover your signature winter personality.</p><button class=btn onclick='start()'>Start Your Winter Journey</button></div>"}
function start(){showQ()}
function showQ(){app.innerHTML=logo()+`<div class=bar><div class=fill style='width:${i/Q.length*100}%'></div></div><p>Question ${i+1} of ${Q.length}</p><h2>${Q[i][0]}</h2>${Q[i][1].map((o,n)=>`<button class='opt' onclick='ans(${n})'>${o}</button>`).join('')}`}
window.ans=(v)=>{s+=v;i++;i<Q.length?showQ():reveal()}
function reveal(){app.innerHTML=logo()+"<div class=center><h1>❄ WINTER IS COMING ❄</h1></div>";setTimeout(result,2000)}
function result(){let r=R[s%R.length];app.innerHTML=logo()+`<div class=center><h3>YOUR WINTER MATCH</h3><h1>${r.n}</h1><h2>${r.t}</h2><div class='desc'>${r.d}</div><br><div style='display:inline-block;background:#ff8c42;color:#fff;font-weight:700;padding:8px 20px;border-radius:20px;margin-bottom:10px'>Share your results</div><br><div style='display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:14px'>

</div><p style='max-width:500px;margin:10px auto 0;font-size:14px;opacity:.9;line-height:1.6'>❄ Get ready — winter's flavor drop is coming.</p><br></div>`}
window.shareResult=function(via){
  let r=R[s%R.length];
  let plainName=r.n.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu,'').trim();
  let text=`My Winter Flavor is ${plainName} — ${r.t}! Find out yours in the Winter Flavor Oracle ❄`;
  let url=location.href.split('#')[0];
  if(via==='teams'){ window.open('https://teams.microsoft.com/share?href='+encodeURIComponent(url)+'&msgText='+encodeURIComponent(text),'_blank'); return; }
}
